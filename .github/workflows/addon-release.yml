name: Firmware updater app release

on:
  push:
    tags:
      - "v*"

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: wisafe2-firmware

permissions:
  contents: read

jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify tag matches app version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          configured="$(sed -n 's/^version: "\(.*\)"/\1/p' wisafe2_firmware/config.yaml)"
          test "$version" = "$configured"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Prepare architecture matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}
          registry-prefix: ghcr.io/niknakk

  build:
    needs: init
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - name: Stage tagged firmware and app sources
        run: python3 scripts/stage_addon_build.py /tmp/wisafe2-addon-context
      - name: Build and publish architecture image
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: /tmp/wisafe2-addon-context
          image: ${{ matrix.image }}
          image-tags: ${{ needs.init.outputs.version }}
          push: "true"
          version: ${{ needs.init.outputs.version }}

  manifest:
    needs: [init, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish generic multi-architecture image
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: ${{ needs.init.outputs.version }}
          registry-prefix: ghcr.io/niknakk
