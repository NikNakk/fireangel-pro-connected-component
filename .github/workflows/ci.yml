name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Validate with HACS
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate with hassfest
        uses: home-assistant/actions/hassfest@master

  firmware:
    name: Compile Arduino firmware
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Install Arduino AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr

      - name: Compile legacy firmware
        run: |
          arduino-cli compile \
            --fqbn arduino:avr:nano:cpu=atmega328old \
            --libraries "$GITHUB_WORKSPACE/firmware/Arduino/libraries" \
            firmware/Arduino/FireAngelNano

      - name: Compile Protocol V2 firmware
        run: |
          arduino-cli compile \
            --fqbn arduino:avr:nano:cpu=atmega328old \
            --libraries "$GITHUB_WORKSPACE/firmware/Arduino/libraries" \
            firmware/Arduino/FireAngelNanoV2

  quality:
    name: Tests and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run Ruff lint checks
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Run tests
        run: pytest

  app:
    name: Validate firmware updater app
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate repository and app YAML
        run: |
          python -m pip install PyYAML
          python - <<'PY'
          import yaml
          repository = yaml.safe_load(open("repository.yaml"))
          app = yaml.safe_load(open("wisafe2_firmware/config.yaml"))
          assert {"name", "url"} <= repository.keys()
          assert {"name", "version", "slug", "description", "arch", "schema"} <= app.keys()
          assert app["image"] == "ghcr.io/niknakk/wisafe2-firmware"
          assert set(app["arch"]) == {"aarch64", "amd64"}
          PY

      - name: Stage release-matched firmware build context
        run: python scripts/stage_app_build.py /tmp/wisafe2-app-context

      - name: Build amd64 app image
        run: |
          docker build \
            --build-arg BUILD_ARCH=amd64 \
            --build-arg BUILD_VERSION=0.1.0 \
            --tag wisafe2-firmware:test \
            /tmp/wisafe2-app-context
