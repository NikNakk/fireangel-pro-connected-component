name: Integration release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Verify integration version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify tag matches integration version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          configured="$(python -c 'import json; print(json.load(open("custom_components/fireangel_pro_connected/manifest.json"))["version"])')"
          test "$version" = "$configured"

  hacs:
    name: HACS validation
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Validate with HACS
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest validation
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate with hassfest
        uses: home-assistant/actions/hassfest@master

  firmware:
    name: Compile Arduino firmware
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"

      - name: Validate firmware version metadata
        run: python scripts/generate_firmware_version_header.py --check

      - name: Install Arduino AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr

      - name: Compile legacy firmware
        run: |
          arduino-cli compile \
            --fqbn arduino:avr:nano:cpu=atmega328old \
            --libraries "$GITHUB_WORKSPACE/firmware/Arduino/libraries" \
            firmware/Arduino/FireAngelNano

      - name: Compile Protocol V2 firmware
        run: |
          arduino-cli compile \
            --fqbn arduino:avr:nano:cpu=atmega328old \
            --libraries "$GITHUB_WORKSPACE/firmware/Arduino/libraries" \
            firmware/Arduino/FireAngelNanoV2

  quality:
    name: Tests and lint
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run Ruff lint checks
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Run tests
        run: pytest

  release:
    name: Create GitHub release
    needs:
      - hacs
      - hassfest
      - firmware
      - quality
    runs-on: ubuntu-latest
    steps:
      - name: Create release for tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
